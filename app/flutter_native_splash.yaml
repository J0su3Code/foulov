  android_12:
    color: "#F5EEE8"
    color_dark: "#0D000E"
    image: assets/splash/transparent.png
    image_dark: assets/splash/transparent.png
    icon_background_color: "#F5EEE8"
    icon_background_color_dark: "#0D000E"
  android: true
  ios: true
  fullscreen: false
