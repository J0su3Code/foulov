# Splash natif : couleur unie identique à la première image de l'intro (fondu depuis cette couleur).
# Garder ces couleurs synchronisées avec lib/theme/foulov_theme.dart et animation/export_app_assets.sh.
# Régénérer après modification : dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0C2219"
  color_dark: "#0A0710"
  image: assets/splash/transparent.png
  image_dark: assets/splash/transparent.png
  android_12:
    color: "#0C2219"
    color_dark: "#0A0710"
    image: assets/splash/transparent.png
    image_dark: assets/splash/transparent.png
    icon_background_color: "#0C2219"
    icon_background_color_dark: "#0A0710"
  android: true
  ios: true
  fullscreen: false
