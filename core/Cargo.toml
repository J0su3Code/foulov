[package]
name = "foulov_core"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Cœur cryptographique de FouLov : sessions Signal (PQXDH + triple ratchet), vérification par symboles, chiffrement des fichiers."
publish = false

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
aes-gcm = { version = "0.10", features = ["stream"] }
async-trait = "0.1"
futures-util = "0.3"
# Version épinglée : ne mettre à jour qu'après lecture du changelog et passage de tous les tests.
prost = "0.14"
libsignal-protocol = { git = "https://github.com/signalapp/libsignal", tag = "v0.106.1" }
rand = "0.9.4"
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }
sha2 = "0.11"
thiserror = "2"
bip39 = { version = "3", features = ["french"] }
hkdf = "0.13"
unicode-normalization = "0.1"
argon2 = "0.6"
hmac = "0.13"
zeroize = "1.8"

[dev-dependencies]
futures-util = "0.3"
tempfile = "3"
